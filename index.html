    else { S.state=Object.assign({},S.state||{}, {flippedTools:flipped}); render(); }
  }));
  document.querySelectorAll('[data-match-chip]').forEach(el=>el.addEventListener('click',()=>el.classList.toggle('selected')));
  document.querySelectorAll('[data-match-tool]').forEach(el=>el.addEventListener('click', async ()=>{
    const idx=(S.state&&S.state.matchIdx)||0;
    const role=SWITCH_ROLES[Math.min(idx,SWITCH_ROLES.length-1)];
    const selections=Object.assign({}, (S.state&&S.state.matchSelections)||{});
    const arr=(selections[role.id]||[]).slice();
    const tool=el.dataset.matchTool;
    const pos=arr.indexOf(tool);
    if(pos>=0) arr.splice(pos,1); else arr.push(tool);
    selections[role.id]=arr;
    await updateState({matchSelections:selections});
    await refreshAll(); render();
  }));
  $('nextMatch') && $('nextMatch').addEventListener('click', async ()=>{
    const idx=(S.state&&S.state.matchIdx)||0;
    const next=Math.min(SWITCH_ROLES.length-1, idx+1);
    await updateState({matchIdx:next});
    await refreshAll(); render();
  });
  $('prevMatch') && $('prevMatch').addEventListener('click', async ()=>{
    const idx=(S.state&&S.state.matchIdx)||0;
    const prev=Math.max(0, idx-1);
    await updateState({matchIdx:prev});
    await refreshAll(); render();
  });

  $('lpIntroPrev') && $('lpIntroPrev').addEventListener('click', ()=>{
    S._lpIntroStep = Math.max(0, (S._lpIntroStep||0)-1); render();
  });
  $('lpIntroNext') && $('lpIntroNext').addEventListener('click', ()=>{
    S._lpIntroStep = (S._lpIntroStep||0)+1; render();
  });

  if(S.view==='landing'){
    async function createHostRoom(){
      const hostName = '房主';
      S.roomCode = genCode();
      S.playerId = 'host';
      S.playerName = hostName;
      S.state = (S._game==='causal') ? initialCausalRoomState() : initialRoomState(6);
      await fSet(`rooms/${S.roomCode}/state`, S.state);
      await fSet(`rooms/${S.roomCode}/players/host`, {name:hostName, joinedAt:Date.now(), isHost:true});
      if(S._game!=='causal' && (!S.packs || !Object.keys(S.packs).length)) await loadPacks();
      S._candidateDraft = [];
      await refreshAll();
      S.view='host'; render();
    }
    $('goHost') && $('goHost').addEventListener('click', createHostRoom);
    $('goJoin') && $('goJoin').addEventListener('click', ()=>{ S._mode='joinForm'; render(); });
    $('goPlay') && $('goPlay').addEventListener('click', ()=>{ S._mode='gameChoice'; render(); });
    $('goGameSwitch') && $('goGameSwitch').addEventListener('click', ()=>{ S._game='switch'; S._mode='playChoice'; render(); });
    $('goGameCausal') && $('goGameCausal').addEventListener('click', ()=>{ S._game='causal'; S._mode='playChoice'; render(); });
    $('backGameChoice') && $('backGameChoice').addEventListener('click', ()=>{ S._mode='gameChoice'; render(); });
    $('goResumeHost') && $('goResumeHost').addEventListener('click', ()=>{ S._mode='resumeHost'; render(); });
    $('backPlayChoice') && $('backPlayChoice').addEventListener('click', ()=>{ S._mode='playChoice'; S.resumeError=null; render(); });
    $('doResumeHost') && $('doResumeHost').addEventListener('click', async ()=>{
      const code = ($('resumeCode').value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(!code){ S.resumeError='請輸入房間代碼'; render(); return; }
      const state = await fGet(`rooms/${code}/state`);
      if(!state){ S.resumeError='找不到此房間，請確認代碼是否正確'; render(); return; }
      S.roomCode = code; S.state = state; S.resumeError = null;
      if(state.gameType!=='causal') await loadPacks();
      await refreshAll();
      S.view='host'; render();
    });
    $('goInfo') && $('goInfo').addEventListener('click', ()=>{ S._mode='info'; render(); });
    $('goInfoSwitch') && $('goInfoSwitch').addEventListener('click', ()=>{ S._mode='infoSwitch'; render(); });
    $('goInfoLandPlan') && $('goInfoLandPlan').addEventListener('click', ()=>{ S._mode='infoLandPlan'; render(); });
    $('goInfoZones') && $('goInfoZones').addEventListener('click', ()=>{ S._mode='infoZones'; render(); });
    $('goInfoContext') && $('goInfoContext').addEventListener('click', ()=>{ S._lpContextStep=0; S._mode='infoLandPlanContext'; render(); });
    $('backInfo') && $('backInfo').addEventListener('click', ()=>{ S._mode='info'; render(); });
    $('backInfoLandPlan') && $('backInfoLandPlan').addEventListener('click', ()=>{ S._mode='infoLandPlan'; render(); });
    $('lpCtxPrev') && $('lpCtxPrev').addEventListener('click', ()=>{ S._lpContextStep = Math.max(0,(S._lpContextStep||0)-1); render(); });
    $('lpCtxNext') && $('lpCtxNext').addEventListener('click', ()=>{ S._lpContextStep = (S._lpContextStep||0)+1; render(); });
    $('backLanding') && $('backLanding').addEventListener('click', ()=>{ S._mode=null; render(); });
    $('doJoin') && $('doJoin').addEventListener('click', async ()=>{
      if(S._joining) return;
      const code = ($('joinCode').value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
      const name = ($('joinName').value||'').trim();
      if(!code || !name){ S.joinError='請輸入房間代碼與名字'; render(); return; }
      S._joining = true; render();
      try{
        const state = await fGet(`rooms/${code}/state`);
        if(!state){ S.joinError='找不到此房間，請確認代碼是否正確'; S._joining=false; render(); return; }
        const id = genId();
        await fSet(`rooms/${code}/players/${id}`, {name, joinedAt:Date.now()});
        S.roomCode = code; S.playerId = id; S.playerName = name; S.state = state; S.joinError=null;
        savePlayerSession(code, id, name);
        if(state.gameType!=='causal') await loadPacks();
        await refreshAll();
        S.view='player';
      } finally {
        S._joining = false;
      }
      render();
    });
  }

  $('nextSpeaker') && $('nextSpeaker').addEventListener('click', async ()=>{
    const order = S.state.speakingOrder && S.state.speakingOrder.length ? S.state.speakingOrder : switchSpeakingOrder();
    const next = Math.min(order.length-1, (S.state.speakingIdx||0)+1);
    await updateState({speakingIdx: next, timerRunning:false, timerEndTs:null, phase:'prep'});
    await refreshAll();
    render();
  });
  $('startTimer') && $('startTimer').addEventListener('click', async ()=>{
    const input = $('timerSeconds');
    const secs = input ? (parseInt(input.value,10)||60) : 60;
    await updateState({timerRunning:true, timerDuration:secs, timerEndTs: Date.now()+secs*1000});
    await refreshAll();
    render();
  });
  $('resetTimer') && $('resetTimer').addEventListener('click', async ()=>{
    await updateState({timerRunning:false, timerEndTs:null});
    await refreshAll();
    render();
  });

  if(S.view==='packManager'){
    $('pmBack') && $('pmBack').addEventListener('click', ()=>{ S.view='landing'; S._mode=null; render(); });
    $('pmNew') && $('pmNew').addEventListener('click', ()=>{ S.packForm = blankPackForm(); render(); });
    document.querySelectorAll('[data-edit-pack]').forEach(elx=>{
      elx.addEventListener('click', ()=>{
        const p = S.packs[elx.dataset.editPack];
        S.packForm = {id:elx.dataset.editPack, title:p.title, briefDescription:p.briefDescription||'', background:p.background, stakeholders:(p.stakeholders||[]).join('\n'), mapImageUrl:p.mapImageUrl||'', stakeholderMapImageUrl:p.stakeholderMapImageUrl||'', strategyTags:(p.strategyTags||[]).slice(), roles: p.roles.map(r=>Object.assign({},r))};
        render();
      });
    });
    document.querySelectorAll('[data-delete-pack]').forEach(elx=>{
      elx.addEventListener('click', async ()=>{
        if(!confirm('確定要刪除這個議題包嗎？')) return;
        await fDelete(`topicPacks/${elx.dataset.deletePack}`);
        await loadPacks();
        render();
      });
    });
    $('pfCancel') && $('pfCancel').addEventListener('click', ()=>{ S.packForm=null; render(); });
    $('pfAddRole') && $('pfAddRole').addEventListener('click', ()=>{ S.packForm.roles.push(blankRole()); render(); });
    document.querySelectorAll('[data-remove-role]').forEach(elx=>{
      elx.addEventListener('click', ()=>{ S.packForm.roles.splice(parseInt(elx.dataset.removeRole,10),1); render(); });
    });
    document.querySelectorAll('[data-role-field]').forEach(elx=>{
      const field = elx.dataset.roleField, idx = parseInt(elx.dataset.roleIdx,10);
      if(field==='polarity'){
        elx.addEventListener('change', e=>{ S.packForm.roles[idx].polarity = e.target.value; render(); });
      } else if(field==='isGovernment'){
        elx.addEventListener('change', e=>{ S.packForm.roles[idx].isGovernment = e.target.checked; });
      } else {
        elx.addEventListener('input', e=>{ S.packForm.roles[idx][field] = e.target.value; });
      }
    });
    $('pf_title') && $('pf_title').addEventListener('input', e=>{ S.packForm.title=e.target.value; });
    $('pf_brief') && $('pf_brief').addEventListener('input', e=>{ S.packForm.briefDescription=e.target.value; });
    $('pf_background') && $('pf_background').addEventListener('input', e=>{ S.packForm.background=e.target.value; });
    $('pf_stakeholders') && $('pf_stakeholders').addEventListener('input', e=>{ S.packForm.stakeholders=e.target.value; });
    $('pf_map') && $('pf_map').addEventListener('input', e=>{ S.packForm.mapImageUrl=e.target.value; });
    $('pf_stakemap') && $('pf_stakemap').addEventListener('input', e=>{ S.packForm.stakeholderMapImageUrl=e.target.value; });
    document.querySelectorAll('[data-strategy-tag]').forEach(elx=>{
      elx.addEventListener('change', e=>{
        const tag = elx.dataset.strategyTag;
        const tags = S.packForm.strategyTags||(S.packForm.strategyTags=[]);
        if(e.target.checked){ if(!tags.includes(tag)) tags.push(tag); }
        else { const i=tags.indexOf(tag); if(i>-1) tags.splice(i,1); }
      });
    });
    $('pfSave') && $('pfSave').addEventListener('click', async ()=>{
      const f = S.packForm;
      if(!f.title.trim() || !f.roles.length || f.roles.some(r=>!r.name.trim())){
        alert('請至少填寫議題標題，以及每張角色卡的名稱'); return;
      }
      const id = f.id || ('pack-'+Date.now().toString(36));
      const pack = {
        id, title:f.title.trim(), briefDescription:(f.briefDescription||'').trim(), background:f.background.trim(),
        stakeholders: f.stakeholders.split('\n').map(s=>s.trim()).filter(Boolean),
        mapImageUrl:(f.mapImageUrl||'').trim(), stakeholderMapImageUrl:(f.stakeholderMapImageUrl||'').trim(),
        strategyTags:(f.strategyTags||[]).slice(),
        roles: f.roles.map(r=>({name:r.name.trim(), background:r.background.trim(), stance:r.stance.trim(), goal:r.goal.trim(), polarity:r.polarity||'neutral', isGovernment:!!r.isGovernment}))
      };
      await fSet(`topicPacks/${id}`, pack);
      await loadPacks();
      S.packForm=null; render();
    });
  }

  if(S.view==='host'){
    $('hostGoHome') && $('hostGoHome').addEventListener('click', ()=>{ S.view='landing'; S._mode=null; render(); });
    $('copyCode') && $('copyCode').addEventListener('click', ()=>{
      navigator.clipboard && navigator.clipboard.writeText(S.roomCode);
    });
    document.querySelectorAll('[data-goto]').forEach(elx=>{
      elx.addEventListener('click', async ()=>{
        const target = parseInt(elx.dataset.goto,10);
        if(target <= S.state.stage+1){
          if(target !== S.state.stage+1 && target !== S.state.stage){
            if(!confirm('確定要跳轉到這個階段嗎？這會重設目前計時器，玩家畫面也會跟著跳轉。')) return;
          }
          const patch={stage:target, timerRunning:false, timerEndTs:null};
          if(target>=2 && target<=4){
            const orders=Object.assign({}, S.state.speakingOrders||{});
            if(!orders['s'+target]) orders['s'+target]=switchSpeakingOrder(target);
            patch.speakingOrders=orders; patch.speakingIdx=0;
          }
          if(target===5){ patch.matchIdx=0; }
          await updateState(patch); await refreshAll(); render();
        }
      });
    });
    document.querySelectorAll('[data-remove-player]').forEach(elx=>{
      elx.addEventListener('click', async ()=>{
        const pid=elx.dataset.removePlayer;
        const name=(S.players[pid]&&S.players[pid].name)||'這位玩家';
        if(!confirm(`確定要移除「${name}」嗎？`)) return;
        await fDelete(`rooms/${S.roomCode}/players/${pid}`);
        await fDelete(`rooms/${S.roomCode}/willingness/${pid}`);
        await fDelete(`rooms/${S.roomCode}/topicPrefs/${pid}`);
        await fDelete(`rooms/${S.roomCode}/proposals/${pid}`);
        await fDelete(`rooms/${S.roomCode}/votes/${pid}`);
        await refreshAll(); render();
      });
    });
    document.querySelectorAll('[data-player-rename]').forEach(elx=>{
      if(elx.disabled) return;
      elx.addEventListener('change', async ()=>{
        const pid=elx.dataset.playerRename;
        const name=(elx.value||'').trim();
        if(!name){ elx.value=(S.players[pid]&&S.players[pid].name)||''; return; }
        await fSet(`rooms/${S.roomCode}/players/${pid}`, Object.assign({}, S.players[pid]||{}, {name}));
        await refreshAll(); render();
      });
    });
    $('targetCount') && $('targetCount').addEventListener('change', async e=>{
      await updateState({playerCountTarget: parseInt(e.target.value,10)||6});
    });
    document.querySelectorAll('[data-candidate]').forEach(elx=>{
      elx.addEventListener('change', e=>{
        const pid = elx.dataset.candidate;
        if(e.target.checked){ if(!S._candidateDraft.includes(pid)) S._candidateDraft.push(pid); }
        else { S._candidateDraft = S._candidateDraft.filter(x=>x!==pid); }
        render();
      });
    });
    $('confirmCandidates') && $('confirmCandidates').addEventListener('click', async ()=>{
      await updateState({candidatePackIds: S._candidateDraft, candidatesOpen:true});
      render();
    });
    document.querySelectorAll('[data-finalize-pack]').forEach(elx=>{
      elx.addEventListener('click', async ()=>{
        await updateState({packId: elx.dataset.finalizePack});
        render();
      });
    });
    $('resetCandidates') && $('resetCandidates').addEventListener('click', async ()=>{
      await updateState({packId:null, candidatesOpen:false, candidatePackIds:[]});
      S._candidateDraft = [];
      render();
    });
    $('toggleWillingness') && $('toggleWillingness').addEventListener('click', async ()=>{
      await updateState({willingnessOpen: !S.state.willingnessOpen});
      render();
    });
    $('saveHostName') && $('saveHostName').addEventListener('click', async ()=>{
      const hostName = (($('hostNameInput')&&$('hostNameInput').value)||'房主').trim() || '房主';
      S.playerName = hostName;
      await fSet(`rooms/${S.roomCode}/players/host`, {name:hostName, joinedAt:(S.players.host&&S.players.host.joinedAt)||Date.now(), isHost:true});
      await refreshAll();
      render();
    });
    $('doAssignRoles') && $('doAssignRoles').addEventListener('click', async ()=>{
      const pack = currentPack();
      const playerIds = Object.keys(S.players);
      S.willingness = await fGetAll(`rooms/${S.roomCode}/willingness`);
      const assignment = assignRolesSmart(pack.roles, playerIds, S.willingness);
      const order = buildSpeakingOrder(playerIds, assignment, pack.roles);
      await updateState({rolesAssignment: assignment, speakingOrder: order, willingnessOpen:false});
      render();
    });
    document.querySelectorAll('[data-speaker]').forEach(elx=>{
      elx.addEventListener('click', async ()=>{
        await updateState({speakingIdx: parseInt(elx.dataset.speaker,10), timerRunning:false, timerEndTs:null, phase:'prep'});
        render();
      });
    });
    $('switchToSpeaking') && $('switchToSpeaking').addEventListener('click', async ()=>{
      await updateState({phase:'speaking', timerRunning:false, timerEndTs:null});
      render();
    });
    $('switchToQuestion') && $('switchToQuestion').addEventListener('click', async ()=>{
      await updateState({hotSeatPhase:'question', timerRunning:false, timerEndTs:null});
      render();
    });
    document.querySelectorAll('[data-hotseat]').forEach(elx=>{
      elx.addEventListener('click', async ()=>{
        await updateState({hotSeatId: elx.dataset.hotseat, timerRunning:false, timerEndTs:null, hotSeatPhase:'question'});
        render();
      });
    });
    $('switchToRespond') && $('switchToRespond').addEventListener('click', async ()=>{
      await updateState({hotSeatPhase:'respond', timerRunning:false, timerEndTs:null});
      render();
    });
    $('markHotseatDone') && $('markHotseatDone').addEventListener('click', async ()=>{
      const done = (S.state.hotSeatDone||[]).slice();
      if(S.state.hotSeatId && !done.includes(S.state.hotSeatId)) done.push(S.state.hotSeatId);
      await updateState({hotSeatDone:done, hotSeatId:null, hotSeatPhase:'question', timerRunning:false, timerEndTs:null});
      render();
    });
    $('hostNotes') && $('hostNotes').addEventListener('change', async e=>{
      await updateState({hostNotes: e.target.value});
    });
    document.querySelectorAll('[data-announce]').forEach(elx=>{
      elx.addEventListener('click', async ()=>{
        const sid = elx.dataset.announce;
        const cur = Object.assign({}, S.state.roundAnnounced);
        cur['r'+sid] = Date.now();
        await updateState({roundAnnounced: cur});
        render();
      });
    });
    $('toggleProposals') && $('toggleProposals').addEventListener('click', async ()=>{
      await updateState({proposalsOpen: !S.state.proposalsOpen});
      render();
    });
    $('toggleVoting') && $('toggleVoting').addEventListener('click', async ()=>{
      if(S.state.votingOpen){ await updateState({votingOpen:false, votingClosed:true}); }
      else{ await updateState({proposalsOpen:false, votingOpen:true}); }
      render();
    });
  }

  if(S.view==='player'){
    $('playerGoHomeEnd') && $('playerGoHomeEnd').addEventListener('click', ()=>{
      clearPlayerSession(); S.view='landing'; S._mode=null; S.roomCode=null; S.playerId=null; S.playerName=null; S._revealed=false; S._endingAnimShown=false;
      render();
    });
    $('roleFace') && $('roleFace').addEventListener('click', ()=>{ S._revealed = true; render(); });
    document.querySelectorAll('[data-dismiss-announce]').forEach(elx=>{
      elx.addEventListener('click', ()=>{
        const sid = elx.dataset.dismissAnnounce;
        const key = 'r'+sid;
        S._seenAnnounce[key] = S.state.roundAnnounced[key];
        render();
      });
    });
    document.querySelectorAll('[data-like]').forEach(elx=>{
      elx.addEventListener('click', async ()=>{
        const pid = elx.dataset.like;
        if(S.myTopicLikes.includes(pid)) S.myTopicLikes = S.myTopicLikes.filter(x=>x!==pid);
        else S.myTopicLikes.push(pid);
        await fSet(`rooms/${S.roomCode}/topicPrefs/${S.playerId}`, {liked:S.myTopicLikes});
        render();
      });
    });
    document.querySelectorAll('[data-willing]').forEach(elx=>{
      elx.addEventListener('change', e=>{
        const v = parseInt(elx.dataset.willing,10);
        if(e.target.checked){ if(!S.myWillingness.includes(v)) S.myWillingness.push(v); }
        else { S.myWillingness = S.myWillingness.filter(x=>x!==v); }
        render();
      });
    });
    $('submitWillingness') && $('submitWillingness').addEventListener('click', async ()=>{
      await fSet(`rooms/${S.roomCode}/willingness/${S.playerId}`, {roles:S.myWillingness, submittedAt:Date.now()});
      await refreshAll(); render();
    });
    $('playerNotes') && $('playerNotes').addEventListener('input', e=>{ S.myNotes = e.target.value; });
    $('proposalDraft') && $('proposalDraft').addEventListener('input', e=>{ S.proposalDraft = e.target.value; });
    $('submitProposal') && $('submitProposal').addEventListener('click', async ()=>{
      const content = (S.proposalDraft||'').trim();
      if(!content) return;
      await fSet(`rooms/${S.roomCode}/proposals/${S.playerId}`, {content, submittedAt:Date.now()});
      S.proposalDraft='';
      await refreshAll(); render();
    });
    document.querySelectorAll('[data-vote-pid]').forEach(elx=>{
      elx.addEventListener('change', e=>{
        const pid = elx.dataset.votePid;
        if(e.target.checked){ if(!S.voteChoices.includes(pid)) S.voteChoices.push(pid); }
        else { S.voteChoices = S.voteChoices.filter(x=>x!==pid); }
        render();
      });
    });
    $('submitVote') && $('submitVote').addEventListener('click', async ()=>{
      if(!S.voteChoices.length) return;
      await fSet(`rooms/${S.roomCode}/votes/${S.playerId}`, {choices:S.voteChoices, submittedAt:Date.now()});
      await refreshAll(); render();
    });
  }
}

/* ---------------- polling loops ---------------- */
setInterval(async ()=>{
  if((S.view==='host'||S.view==='player') && S.roomCode){
    await refreshAll();
    const ae = document.activeElement;
    const typing = ae && (ae.tagName==='TEXTAREA' || (ae.tagName==='INPUT' && ae.type!=='checkbox' && ae.type!=='radio'));
    if(!typing) render(); else tickTimerDisplay();
  }
}, 3000);

setInterval(()=>{ tickTimerDisplay(); }, 500);

(async ()=>{ if(!(await tryResumePlayerSession())) render(); })();
</script>
