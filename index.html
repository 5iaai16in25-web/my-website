<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;600&display=swap');

:root{
  --paper:#EDE7D8;
  --paper-dark:#E1D9C4;
  --ink:#262421;
  --ink-soft:#5b564d;
  --green:#3E6B4E;
  --blue:#2B5F79;
  --ochre:#B8863A;
  --red:#A63D2F;
  --seal:#AE3327;
  --line:#c7bc9d;
  --card:#F7F3E7;
}
*{box-sizing:border-box;}
#app{
  font-family:'Noto Sans TC', sans-serif;
  color:var(--ink);
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 28px),
    repeating-linear-gradient(90deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 28px),
    var(--paper);
  min-height:100vh;
  padding:0;
  line-height:1.6;
}
h1,h2,h3,.serif{font-family:'Noto Serif TC', serif;}
.mono{font-family:'Roboto Mono', monospace;}
button{font-family:inherit;cursor:pointer;border:none;}
input,textarea{font-family:inherit;}

.wrap{max-width:960px;margin:0 auto;padding:24px 20px 60px;}
.wrap.wide{max-width:1180px;}

/* ---------- landing ---------- */
.landing{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.landing-card{max-width:560px;width:100%;text-align:center;}
.eyebrow{letter-spacing:.2em;font-size:12px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:10px;}
.title-xl{font-size:clamp(28px,5vw,44px);font-weight:900;margin:0 0 6px;}
.subtitle{color:var(--ink-soft);margin-bottom:34px;font-size:15px;}
.choice-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.choice-btn{
  flex:1 1 220px;background:var(--card);border:1.5px solid var(--line);border-radius:4px;
  padding:26px 18px;text-align:left;transition:transform .15s, box-shadow .15s;box-shadow:0 1px 0 var(--line);
}
.choice-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(38,36,33,.12);}
.choice-btn .ico{font-size:26px;display:block;margin-bottom:10px;}
.choice-btn b{font-family:'Noto Serif TC',serif;font-size:18px;display:block;margin-bottom:4px;}
.choice-btn span.desc{font-size:13px;color:var(--ink-soft);}

.join-form{max-width:400px;margin:0 auto;text-align:left;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.04em;}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:3px;background:#fff;font-size:16px;}
.code-input{text-transform:uppercase;letter-spacing:.35em;font-family:'Roboto Mono',monospace;font-weight:600;font-size:22px !important;text-align:center;}
.primary-btn{
  width:100%;background:var(--seal);color:#fff;padding:13px;border-radius:3px;font-weight:700;
  font-size:15px;letter-spacing:.03em;box-shadow:0 2px 0 rgba(0,0,0,.15);
}
.primary-btn:disabled{opacity:.4;cursor:not-allowed;}
.ghost-btn{background:transparent;border:1.5px solid var(--line) !important;color:var(--ink);padding:10px 16px;border-radius:3px;font-size:13px;}
.back-link{display:inline-block;margin-top:18px;font-size:13px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;}
.error-msg{color:var(--seal);font-size:13px;margin-top:10px;}

/* ---------- header ---------- */
.topbar{
  background:var(--ink);color:var(--paper);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:10px;
}
.topbar .room-chip{display:flex;align-items:center;gap:10px;}
.room-code-badge{
  font-family:'Roboto Mono',monospace;letter-spacing:.25em;background:var(--paper);color:var(--ink);
  padding:5px 12px;border-radius:3px;font-weight:700;font-size:15px;cursor:pointer;
}
.stage-tag{font-size:12px;color:#c9c2ac;}
.role-badge{font-size:12px;opacity:.85;}

/* ---------- host layout ---------- */
.host-layout{display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:start;}
@media (max-width:760px){.host-layout{grid-template-columns:1fr;}}
.stepper{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 10px;position:sticky;top:80px;}
.step-item{
  display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:3px;cursor:pointer;font-size:13px;
  color:var(--ink-soft);position:relative;
}
.step-item.active{background:var(--ink);color:var(--paper);}
.step-item.done{color:var(--ink);}
.step-num{
  width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;
  font-family:'Roboto Mono',monospace;font-size:11px;flex:none;
}
.step-item.done .step-num{background:var(--green);border-color:var(--green);color:#fff;}
.step-item.active .step-num{border-color:var(--paper);}

.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:26px 26px 30px;min-height:360px;position:relative;}
.panel h2{margin:0 0 4px;font-size:22px;}
.panel .stage-sub{color:var(--ink-soft);font-size:13px;margin-bottom:22px;}
.next-row{margin-top:28px;display:flex;justify-content:flex-end;gap:10px;border-top:1px dashed var(--line);padding-top:18px;}

/* seal stamp animation */
.seal{
  position:absolute;top:20px;right:26px;width:64px;height:64px;border-radius:46% 54% 52% 48%/54% 44% 56% 46%;
  border:3px solid var(--seal);color:var(--seal);display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif TC',serif;font-weight:900;font-size:13px;text-align:center;line-height:1.1;
  transform:scale(0) rotate(-14deg);opacity:0;
}
.seal.show{animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes stampIn{
  0%{transform:scale(2.6) rotate(-14deg);opacity:0;}
  55%{transform:scale(.92) rotate(-8deg);opacity:1;}
  75%{transform:scale(1.08) rotate(-11deg);}
  100%{transform:scale(1) rotate(-9deg);opacity:1;}
}

/* zone swatches */
.hier-diagram{margin:22px 0 4px;}
.hier-children{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;text-align:left;}
.hier-child{flex:1 1 220px;}
.zone-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.zone-card{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;}
.zone-head{padding:10px 14px;color:#fff;font-weight:700;font-family:'Noto Serif TC',serif;font-size:15px;}
.zone-body{padding:12px 14px;font-size:13.5px;color:var(--ink-soft);}
.z-green{background:var(--green);} .z-blue{background:var(--blue);} .z-ochre{background:var(--ochre);} .z-red{background:var(--red);}
.t-green{color:var(--green);} .t-blue{color:var(--blue);} .t-ochre{color:var(--ochre);} .t-red{color:var(--red);}

.topic-card{border:1.5px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:12px;cursor:pointer;background:#fff;}
.topic-card.selected{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal) inset;}
.topic-card b{font-family:'Noto Serif TC',serif;font-size:16px;}
.topic-card p{font-size:13.5px;color:var(--ink-soft);margin:8px 0 0;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag{background:var(--paper-dark);border-radius:20px;padding:3px 10px;font-size:11.5px;color:var(--ink-soft);}

.player-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.player-chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;display:flex;gap:6px;align-items:center;}
.player-chip .role-tag{font-size:11px;color:var(--ink-soft);}
.player-chip.manage{padding-right:6px;}
.player-chip input.player-name-edit{border:0;background:transparent;min-width:80px;max-width:120px;font-size:13px;color:var(--ink);outline:none;}
.player-remove{border:0 !important;background:transparent;color:var(--seal);font-weight:900;font-size:14px;padding:2px 6px;border-radius:12px;cursor:pointer;}
.player-remove:hover{background:#f3e2df;}
.tool-card.disabled .tool-inner{cursor:not-allowed;}
.tool-card.lock-wiggle .tool-inner{animation:lockWiggle .28s ease-in-out;}
@keyframes lockWiggle{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

table.role-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px;}
table.role-table th,table.role-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
table.role-table th{color:var(--ink-soft);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}

.speaker-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;}
.speaker-pill{padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:13px;}
.speaker-pill.current{background:var(--ink);color:#fff;border-color:var(--ink);}
.timer-box{
  display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px 20px;margin-top:16px;
}
.timer-display{font-family:'Roboto Mono',monospace;font-size:34px;font-weight:700;min-width:110px;}
.timer-display.warn{color:var(--seal);}
.control-btn{background:var(--ink);color:#fff;padding:9px 16px;border-radius:3px;font-size:13px;font-weight:600;}
.control-btn.alt{background:transparent;border:1.5px solid var(--line) !important;color:var(--ink);}
.control-btn:disabled{opacity:.35;}

.list-item{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 16px;margin-bottom:10px;}
.list-item .meta{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
.empty-note{color:var(--ink-soft);font-size:13.5px;font-style:italic;padding:20px 0;text-align:center;}

.vote-bar-wrap{background:var(--paper-dark);border-radius:3px;height:8px;overflow:hidden;margin-top:6px;}
.vote-bar{height:100%;background:var(--seal);}

textarea.note-area{width:100%;border:1.5px solid var(--line);border-radius:3px;padding:12px;font-size:14px;min-height:90px;background:#fff;}

/* ---------- player view ---------- */
.player-wrap{max-width:480px;margin:0 auto;padding:0 16px 50px;}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 20px;margin-top:18px;}
.pcard h2{margin:0 0 8px;font-size:19px;}
.waiting{text-align:center;padding:50px 10px;color:var(--ink-soft);}
.waiting .spin{font-size:30px;display:block;margin-bottom:14px;animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}



/* ---- switch gameplay flow added ---- */

.role-corner{position:fixed;right:22px;bottom:22px;z-index:50;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
.role-corner .role-avatar{width:38px;height:38px;border-radius:10px;}
.role-corner-label{font-size:12px;color:var(--ink-soft);line-height:1.3;}
.role-tooltip{position:fixed;right:22px;bottom:86px;max-width:320px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.65;z-index:60;display:none;box-shadow:0 6px 22px rgba(0,0,0,.18);}
.role-corner:hover + .role-tooltip{display:block;}
.host-name-form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px;}
.host-name-form input{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;}

.flow-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;}
@media(max-width:860px){.flow-grid{grid-template-columns:1fr;}}
.flow-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;}
.flow-card h3{margin:0 0 8px;font-size:18px;}
.flow-muted{color:var(--ink-soft);font-size:13px;line-height:1.7;}
.flow-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;}
@media(max-width:900px){.flow-tools{grid-template-columns:1fr;}}
.tool-card{perspective:1000px;min-height:190px;}
.tool-inner{position:relative;width:100%;min-height:190px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer;}
.tool-card.flipped .tool-inner{transform:rotateY(180deg);}
.tool-face{position:absolute;inset:0;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:14px;backface-visibility:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:auto;}
.tool-back{display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,var(--paper-dark),var(--card));font-family:'Noto Serif TC',serif;font-weight:900;letter-spacing:.08em;color:var(--ink-soft);}
.tool-front{transform:rotateY(180deg);}
.tool-front h4{margin:0 0 8px;font-size:16px;color:var(--blue);}
.tool-front p{margin:6px 0;font-size:12.5px;line-height:1.65;}
.role-mini{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;}
.role-avatar{width:42px;height:42px;border-radius:12px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.timer-box{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--ink);color:#fff;border-radius:16px;padding:18px;margin:16px 0;}
.timer-display{font-family:'Roboto Mono',monospace;font-size:42px;font-weight:700;letter-spacing:.06em;}
.timer-display.warn{color:#ffb3a9;}
.match-row{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:14px;margin:12px 0;}
.match-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.match-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer;}
.match-chip.selected{background:var(--blue);color:#fff;border-color:var(--blue);}
.answer-list{display:grid;gap:10px;margin-top:12px;}
.answer-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;}

/* ---- intro / welcome card (stage 1 player waiting) ---- */
.intro-card{text-align:center;}
.intro-icon{font-size:38px;display:block;margin-bottom:6px;}
.intro-title{font-family:'Noto Serif TC',serif;font-weight:900;font-size:20px;margin:0 0 4px;}
.intro-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;}
.intro-points{text-align:left;display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.intro-point{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 14px;}
.intro-point .pi{font-size:19px;flex:none;line-height:1.3;}
.intro-point p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.65;}
.intro-flow{display:flex;align-items:center;justify-content:center;gap:4px;margin:18px 0;flex-wrap:wrap;}
.intro-flow-step{flex:1 1 84px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 6px;font-size:11.5px;color:var(--ink-soft);text-align:center;}
.intro-flow-step .fi{font-size:20px;display:block;margin-bottom:5px;}
.intro-flow-step b{display:block;color:var(--ink);font-family:'Noto Serif TC',serif;font-size:13px;margin-bottom:2px;}
.intro-flow-arrow{color:var(--line);font-size:16px;flex:none;}
.intro-waiting{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);}
.intro-waiting .waiting{padding:10px;}

/* ---- land-plan knowledge intro (stage 2, before minigame) ---- */
.lp-intro-dots{display:flex;justify-content:center;gap:7px;margin-bottom:14px;}
.lp-dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:all .2s;}
.lp-dot.active{background:var(--ochre);width:22px;border-radius:5px;}
.lp-timeline{display:flex;align-items:center;justify-content:center;gap:4px;margin:16px 0 6px;flex-wrap:wrap;}
.lp-tl-step{flex:1 1 130px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 8px;font-size:11.5px;color:var(--ink-soft);text-align:center;}
.lp-tl-step b{display:block;color:var(--ink);font-family:'Roboto Mono',monospace;font-size:12.5px;margin-bottom:3px;}
.lp-intro-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
.lp-zone-title-en{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--ink-soft);text-align:center;margin:-8px 0 14px;letter-spacing:.03em;}
.lp-zone-subs{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.lp-zone-sub-item{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:4px;padding:9px 12px;font-size:12.5px;color:var(--ink-soft);line-height:1.65;}
.lp-zone-subs.lp-zone-z-cons .lp-zone-sub-item{border-left-color:var(--green);}
.lp-zone-subs.lp-zone-z-marine .lp-zone-sub-item{border-left-color:var(--blue);}
.lp-zone-subs.lp-zone-z-agri .lp-zone-sub-item{border-left-color:var(--ochre);}
.lp-zone-subs.lp-zone-z-urban .lp-zone-sub-item{border-left-color:var(--seal);}
.lp-zone-sub-item.indent{margin-left:22px;background:var(--paper);font-size:12px;}
.zsi-badge{font-family:'Roboto Mono',monospace;font-weight:700;color:var(--ink);margin-right:6px;white-space:nowrap;}
.zsi-text{color:var(--ink-soft);}

/* ---- 資訊了解：國土功能分區圖像化卡片 ---- */
.zone-type-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0 22px;}
.zone-type-chip{display:flex;align-items:center;gap:6px;color:#fff;font-family:'Noto Serif TC',serif;font-weight:700;font-size:13px;padding:8px 14px;border-radius:20px;}
.zone-type-chip .ztc-icon{font-size:16px;}
.zone-type-z-cons{background:var(--green);}
.zone-type-z-marine{background:var(--blue);}
.zone-type-z-agri{background:var(--ochre);}
.zone-type-z-urban{background:var(--seal);}
.zone-detail-stack{display:flex;flex-direction:column;gap:18px;}
.zone-detail-card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;text-align:left;}
.zone-detail-head{display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff;}
.zone-detail-head.z-cons{background:var(--green);}
.zone-detail-head.z-marine{background:var(--blue);}
.zone-detail-head.z-agri{background:var(--ochre);}
.zone-detail-head.z-urban{background:var(--seal);}
.zdh-icon{font-size:28px;line-height:1;}
.zdh-name{font-family:'Noto Serif TC',serif;font-weight:700;font-size:16px;}
.zdh-en{font-family:'Roboto Mono',monospace;font-size:10.5px;opacity:.85;letter-spacing:.03em;margin-top:2px;}
.zone-detail-desc{padding:14px 16px 6px;font-size:13px;color:var(--ink-soft);line-height:1.75;margin:0;}

/* ---- prop hint strip (hover tooltip like MG zone info) ---- */
.prop-strip-wrap{margin:14px 0 4px;padding:12px 14px;background:#fff;border:1px dashed var(--line);border-radius:4px;}
.prop-strip-label{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
.prop-strip{display:flex;flex-wrap:wrap;gap:14px;}
.prop-icon-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:help;}
.prop-icon{width:46px;height:46px;border-radius:8px;overflow:hidden;border:1.5px solid var(--line);background:#fff;transition:transform .15s, box-shadow .15s;}
.prop-icon img{width:100%;height:100%;object-fit:cover;display:block;}
.prop-icon-wrap:hover .prop-icon{transform:translateY(-2px);box-shadow:0 4px 12px rgba(38,36,33,.18);border-color:var(--ochre);}
.prop-icon-label{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
.next-row .next-hint{flex:1;text-align:left;color:var(--ink-soft);font-size:12.5px;align-self:center;margin:0;}

/* ---- strategy framework mind-map (topic selection stage) ---- */
.topic-stage-grid{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start;}
@media (max-width:900px){.topic-stage-grid{grid-template-columns:1fr;}}
.strategy-framework{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px 14px;position:sticky;top:12px;}
.sf-root{font-family:'Noto Serif TC',serif;font-weight:900;font-size:14px;text-align:center;background:var(--paper-dark);border:1.5px solid var(--ink);border-radius:6px;padding:10px 8px;margin-bottom:14px;line-height:1.4;}
.sf-branch{margin-bottom:12px;border-left:3px solid var(--ochre);padding-left:10px;transition:opacity .2s;}
.sf-branch:last-child{margin-bottom:0;}
.sf-branch-title{font-family:'Noto Serif TC',serif;font-weight:700;font-size:12.5px;color:var(--ink);margin-bottom:6px;line-height:1.4;transition:opacity .2s;}
.sf-leaf-list{display:flex;flex-direction:column;gap:5px;}
.sf-leaf{font-size:11.5px;color:var(--ink-soft);padding:6px 8px;border-radius:3px;background:var(--paper);border:1px solid transparent;line-height:1.5;transition:all .2s;}
.sf-leaf.active{color:var(--ink);background:#fdf3d9;border-color:var(--ochre);font-weight:700;box-shadow:0 2px 8px rgba(196,142,54,.28);}
.sf-leaf.dim{opacity:.25;}
.sf-branch.dim{opacity:.4;}
.topic-stage-main{min-width:0;}

/* ---- pack manager: strategy tag checklist ---- */
.pf-strategy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:16px;}
.pf-strategy-branch{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px;}
.pf-strategy-branch-title{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.pf-strategy-leaf{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--ink-soft);margin-bottom:5px;cursor:pointer;line-height:1.5;}
.pf-strategy-leaf input{margin-top:3px;}

.role-flip{perspective:1000px;margin-top:10px;}
.role-face{
  background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:22px;text-align:center;cursor:pointer;
}
.role-face .seal-lg{
  width:88px;height:88px;margin:0 auto 14px;border-radius:46% 54% 52% 48%/54% 44% 56% 46%;
  border:3px solid var(--seal);color:var(--seal);display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif TC',serif;font-weight:900;font-size:14px;
}
.revealed{}
.role-name{font-family:'Noto Serif TC',serif;font-size:21px;font-weight:900;margin:4px 0 14px;}
.role-detail-row{text-align:left;font-size:13.5px;margin-bottom:10px;}
.role-detail-row b{display:block;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}

.radio-card{border:1.5px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:10px;background:#fff;display:flex;gap:10px;align-items:flex-start;cursor:pointer;}
.radio-card.picked{border-color:var(--seal);background:#fff7f4;}
.radio-card input{margin-top:3px;}

.submit-row{margin-top:16px;}
.small-note{font-size:12px;color:var(--ink-soft);margin-top:8px;}
.done-check{color:var(--green);font-weight:700;}

/* ---- v2 additions: pack manager, willingness, hot-seat, notes ---- */
.top-links{display:flex;justify-content:center;gap:18px;margin-top:22px;}
.top-links a{font-size:12.5px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;}
.pm-wrap{max-width:820px;margin:0 auto;padding:24px 20px 60px;}
.pm-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.pm-list{display:grid;gap:12px;margin-bottom:30px;}
.pm-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.pm-card b{font-family:'Noto Serif TC',serif;font-size:15px;}
.pm-card .meta{font-size:12px;color:var(--ink-soft);}
.pm-card-actions{display:flex;gap:8px;flex:none;}
.pm-form{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:22px;}
.pm-form h3{margin:0 0 14px;font-size:16px;}
.role-row{border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:10px;background:#fff;position:relative;}
.role-row-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
.role-row textarea{min-height:44px;}
.role-row .rr-top{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.role-row select{padding:8px;border:1px solid var(--line);border-radius:3px;}
.remove-role{background:transparent;color:var(--seal);border:1px solid var(--seal) !important;padding:4px 10px;border-radius:3px;font-size:12px;flex:none;}
.gov-check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);}
.polarity-badge{font-size:10.5px;padding:2px 8px;border-radius:10px;margin-left:6px;}
.pol-support{background:#e2ede4;color:var(--green);}
.pol-oppose{background:#f3e2df;color:var(--seal);}
.pol-neutral{background:var(--paper-dark);color:var(--ink-soft);}
.willing-grid{display:grid;gap:10px;}
.willing-card{border:1.5px solid var(--line);border-radius:4px;padding:12px 14px;background:#fff;display:flex;gap:10px;align-items:flex-start;cursor:pointer;}
.willing-card.picked{border-color:var(--green);background:#f2f6f0;}
.vote-tally-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.hotseat-box{background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:18px;text-align:center;margin:14px 0;}
.hotseat-box .name{font-size:22px;font-weight:900;font-family:'Noto Serif TC',serif;}
.progress-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.progress-pill{padding:4px 10px;border-radius:14px;font-size:11.5px;border:1px solid var(--line);}
.progress-pill.done{background:var(--green);border-color:var(--green);color:#fff;}

/* ---- v3 additions ---- */
.candidate-card{border:1.5px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:10px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.candidate-card b{font-family:'Noto Serif TC',serif;font-size:15px;}
.candidate-card p{font-size:12.5px;color:var(--ink-soft);margin:4px 0 0;}
.like-btn{background:#fff;border:1.5px solid var(--line) !important;padding:8px 14px;border-radius:20px;font-size:13px;flex:none;}
.like-btn.liked{background:#fdeceb;border-color:var(--seal) !important;color:var(--seal);}
.like-count{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.announce-overlay{background:var(--ink);color:var(--paper);border-radius:6px;padding:60px 26px;text-align:center;}
.announce-overlay .round-tag{font-size:12px;letter-spacing:.3em;opacity:.7;text-transform:uppercase;margin-bottom:14px;}
.announce-overlay .round-title{font-family:'Noto Serif TC',serif;font-size:32px;font-weight:900;margin-bottom:16px;animation:announcePop .6s cubic-bezier(.2,1.5,.4,1);}
.announce-overlay .round-topic{font-size:15px;opacity:.9;margin-bottom:26px;}
@keyframes announcePop{0%{transform:scale(.5);opacity:0;}60%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);}}
.phase-tag{display:inline-block;padding:3px 12px;border-radius:14px;font-size:11.5px;font-weight:700;margin-bottom:10px;}
.phase-prep{background:var(--paper-dark);color:var(--ink-soft);}
.phase-speaking{background:#e2ede4;color:var(--green);}
.phase-question{background:var(--paper-dark);color:var(--ink-soft);}
.phase-respond{background:#fdeceb;color:var(--seal);}
.order-strip{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;}
.order-chip{padding:4px 10px;border-radius:14px;font-size:11.5px;border:1px solid var(--line);background:#fff;}
.order-chip.current{background:var(--ink);color:#fff;border-color:var(--ink);}
.map-preview{width:100%;border-radius:4px;border:1px solid var(--line);margin-top:10px;max-height:220px;object-fit:cover;display:block;}
.topbar-btn{background:transparent;border:1px solid rgba(255,255,255,.35) !important;color:var(--paper);padding:6px 12px;border-radius:3px;font-size:12px;}
.topbar-btn:hover{border-color:rgba(255,255,255,.7) !important;}
.ending-card{text-align:center;}
.ending-card.anim{animation:endingPop .7s cubic-bezier(.2,1.4,.4,1);}
@keyframes endingPop{0%{transform:scale(.7);opacity:0;}60%{transform:scale(1.06);opacity:1;}100%{transform:scale(1);}}
.ending-emoji{font-size:48px;margin-bottom:10px;}
.intro-section{text-align:left;margin-top:6px;}
.intro-section h3{font-family:'Noto Serif TC',serif;font-size:20px;margin:26px 0 8px;color:var(--ink);}
.intro-section h3:first-child{margin-top:6px;}
.intro-section p{font-size:16px;color:var(--ink-soft);line-height:1.9;margin:0 0 16px;}
.intro-section ul{margin:6px 0 0;padding-left:20px;font-size:16px;color:var(--ink-soft);line-height:1.9;}
.intro-section li{margin-bottom:10px;}
.intro-section h3 .tag{margin-left:6px;vertical-align:middle;}

/* ---- Stage 2 minigame: 國土功能分區配對 ---- */
.mg-header{text-align:center;padding:6px 4px 14px;border-bottom:1px dashed var(--line);margin-bottom:14px;}
.mg-header h3{font-family:'Noto Serif TC',serif;font-size:20px;margin:0 0 4px;letter-spacing:.08em;}
.mg-header p{font-size:13px;color:var(--ink-soft);margin:0 0 10px;}
.mg-progress-bar{width:min(280px,80%);height:6px;background:var(--paper-dark);border-radius:3px;margin:0 auto;overflow:hidden;border:1px solid var(--line);}
.mg-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--ochre),var(--seal));transition:width .4s ease;}
.mg-progress-text{font-family:'Roboto Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:6px;letter-spacing:.05em;}
.mg-zones{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
@media(max-width:820px){.mg-zones{grid-template-columns:repeat(2,1fr);}}
.mg-zone{background:var(--card);border:1.5px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;min-height:140px;transition:transform .15s,box-shadow .15s;position:relative;}
.mg-zone.snap-target{transform:scale(1.02);box-shadow:0 0 0 3px var(--zone-color,var(--line)),0 6px 20px rgba(0,0,0,.12);}
.mg-zone[data-zone="conservation"]{--zone-color:var(--green);}
.mg-zone[data-zone="marine"]{--zone-color:var(--blue);}
.mg-zone[data-zone="agriculture"]{--zone-color:var(--ochre);}
.mg-zone[data-zone="urban"]{--zone-color:var(--seal);}
.mg-zone-head{padding:9px 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);cursor:help;background:var(--paper);}
.mg-zone-head::before{content:"";width:5px;height:22px;background:var(--zone-color);border-radius:1px;flex:none;}
.mg-zone-icon{font-size:15px;line-height:1;}
.mg-zone-name{font-family:'Noto Serif TC',serif;font-size:14px;font-weight:700;color:var(--zone-color);letter-spacing:.05em;}
.mg-zone-drop{min-height:36px;margin:8px;border:1.5px dashed var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px;transition:border-color .2s,background .2s;}
.mg-zone.snap-target .mg-zone-drop{border-style:solid;border-color:var(--zone-color);background:rgba(0,0,0,.03);}
.mg-zone-drop.hidden{display:none;}
.mg-zone-chain{display:flex;flex-direction:column;padding:0 8px 8px;max-height:260px;overflow-y:auto;gap:4px;}
.mg-zone-chain::-webkit-scrollbar{width:3px;} .mg-zone-chain::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
.mg-chain-card{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:3px;padding:6px 8px;font-size:12px;animation:mgSlideIn .3s ease;}
.mg-chain-card.correct{border-left-color:var(--green);}
.mg-chain-card.incorrect{border-left-color:var(--seal);}
.mg-chain-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.mg-chain-name{font-weight:600;flex:1;color:var(--ink);font-family:'Noto Serif TC',serif;font-size:12.5px;}
.mg-result-icon{font-family:'Roboto Mono',monospace;font-size:12px;flex:none;}
.mg-chain-card.correct .mg-result-icon{color:var(--green);}
.mg-chain-card.incorrect .mg-result-icon{color:var(--seal);}
.mg-chain-info{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);font-size:11px;color:var(--ink-soft);line-height:1.5;}
.mg-ztag{display:inline-block;padding:1px 6px;border-radius:2px;font-size:10.5px;margin:2px 3px 0 0;color:#fff;font-family:'Noto Serif TC',serif;letter-spacing:.06em;}
.mg-ztag.z-cons{background:var(--green);}
.mg-ztag.z-marine{background:var(--blue);}
.mg-ztag.z-agri{background:var(--ochre);}
.mg-ztag.z-urban{background:var(--seal);}
.mg-tray{background:var(--paper);border:1.5px solid var(--line);border-radius:4px;padding:22px 12px 14px;min-height:120px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;position:relative;}
.mg-tray-label{position:absolute;top:6px;left:10px;font-size:11px;color:var(--ink-soft);letter-spacing:.15em;font-family:'Noto Serif TC',serif;}
.mg-card{width:150px;padding:10px 12px;border-radius:3px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 1px 0 var(--line);cursor:grab;touch-action:none;position:relative;transition:transform .15s,box-shadow .15s;}
.mg-card:hover:not(.ghost){transform:translateY(-2px);box-shadow:0 6px 16px rgba(38,36,33,.12);}
.mg-card .mg-card-cat{font-size:10.5px;padding:1px 6px;border-radius:2px;background:var(--paper-dark);color:var(--ink-soft);display:inline-block;margin-bottom:6px;letter-spacing:.1em;}
.mg-card .mg-card-name{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:4px;}
.mg-card .mg-card-desc{font-size:11px;color:var(--ink-soft);line-height:1.4;}
.mg-card.ghost{opacity:.25;pointer-events:none;}
.mg-card.deal-in{animation:mgDealIn .45s cubic-bezier(.16,1,.3,1) both;}
.mg-drag-clone{position:fixed;z-index:1000;pointer-events:none;border-radius:3px;background:var(--card);border:1.5px solid var(--ink);box-shadow:0 14px 40px rgba(0,0,0,.22);padding:10px 12px;opacity:.95;}
.mg-drag-clone .mg-card-cat{font-size:10.5px;padding:1px 6px;border-radius:2px;background:var(--paper-dark);color:var(--ink-soft);display:inline-block;margin-bottom:6px;letter-spacing:.1em;}
.mg-drag-clone .mg-card-name{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:700;color:var(--ink);line-height:1.3;}
.mg-tooltip{position:fixed;z-index:200;max-width:320px;padding:12px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:4px;box-shadow:0 8px 32px rgba(0,0,0,.15);font-size:13px;line-height:1.6;pointer-events:none;opacity:0;transition:opacity .15s;color:var(--ink);}
.mg-tooltip.visible{opacity:1;}
.mg-tooltip h4{font-family:'Noto Serif TC',serif;font-size:14px;margin:0 0 6px;font-weight:700;}
.mg-tooltip .mg-sub-item{color:var(--ink-soft);padding-left:12px;text-indent:-12px;font-size:12px;margin-top:2px;}
.mg-tooltip .mg-sub-item::before{content:"‧ ";color:var(--ink-soft);}
.mg-overlay{position:absolute;inset:0;z-index:5;background:rgba(237,231,216,.92);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;border-radius:4px;animation:mgFadeIn .3s ease;padding:12px;}
.mg-overlay-box{background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:22px 26px;max-width:440px;width:100%;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.15);}
.mg-overlay-box h3{font-family:'Noto Serif TC',serif;font-size:22px;margin:0 0 6px;letter-spacing:.08em;}
.mg-overlay-box .mg-lead{color:var(--ink-soft);margin:0 0 12px;line-height:1.6;font-size:13px;}
.mg-stat{display:flex;justify-content:center;gap:22px;margin-bottom:12px;}
.mg-stat-item{text-align:center;}
.mg-stat-num{font-family:'Roboto Mono',monospace;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;}
.mg-stat-num.green{color:var(--green);}
.mg-stat-num.red{color:var(--seal);}
.mg-stat-label{font-size:11px;color:var(--ink-soft);letter-spacing:.12em;margin-top:2px;}
.mg-instructions{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:12px 14px 12px 30px;font-size:13px;line-height:1.7;margin:12px 0;}
.mg-instructions li{margin-bottom:2px;}
.mg-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0;text-align:left;}
.mg-legend-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);}
.mg-legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.mg-endmsg{font-size:13px;color:var(--ink-soft);margin:0 0 12px;line-height:1.6;}
.mg-toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);}
.mg-toolbar .small-note{font-size:12px;color:var(--ink-soft);}
@keyframes mgSlideIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
@keyframes mgDealIn{from{opacity:0;transform:translateX(60px) rotate(6deg) scale(.9);}to{opacity:1;transform:translateX(0) rotate(0) scale(1);}}
@keyframes mgFadeIn{from{opacity:0;}to{opacity:1;}}

/* ---- causal-chain minigame (國土事件因果拼圖) ---- */
.cg-launch{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border:1.5px solid var(--seal);border-radius:4px;padding:16px 18px;margin-top:16px;}
.cg-launch .cg-launch-copy{flex:1;min-width:0;}
.cg-launch b{display:block;font-family:'Noto Serif TC',serif;font-size:15px;color:var(--ink);margin-bottom:2px;}
.cg-launch span{display:block;font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
.cg-launch button{background:var(--seal);color:#fff;padding:11px 18px;border-radius:3px;font-weight:700;font-size:13.5px;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap;}
.cg-launch button:hover{filter:brightness(1.08);}
.cg-hero{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px 22px 22px;margin-top:6px;}
.cg-hero .cg-eyebrow{letter-spacing:.18em;font-size:11px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;}
.cg-hero h3{font-family:'Noto Serif TC',serif;font-weight:900;font-size:21px;margin:0 0 8px;color:var(--ink);}
.cg-hero p.cg-lede{font-size:13.5px;color:var(--ink-soft);margin:0 0 10px;line-height:1.75;}
.cg-legend-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.cg-legend-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:11.5px;color:var(--ink-soft);}
.cg-legend-chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.cg-tracker{margin:16px 0 4px;}
.cg-tracker svg{width:100%;height:34px;display:block;}
.cg-stage-head{margin-top:16px;}
.cg-stage-eyebrow{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.08em;}
.cg-stage-head h4{font-family:'Noto Serif TC',serif;font-size:19px;margin:4px 0 6px;line-height:1.4;color:var(--ink);font-weight:900;}
.cg-stage-instruction{font-size:13.5px;color:var(--ink-soft);line-height:1.75;}
.cg-chain{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
.cg-chain.empty{color:var(--ink-soft);font-size:12.5px;justify-content:center;padding:14px;font-style:italic;}
.cg-chain-chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:3px;white-space:nowrap;font-family:'Noto Serif TC',serif;}
.cg-chain-arrow{color:var(--ink-soft);font-family:'Roboto Mono',monospace;font-size:13px;}
.cg-chain .cg-info-line{width:100%;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
.cg-section-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin:16px 0 8px;display:flex;align-items:center;gap:6px;letter-spacing:.03em;}
.cg-section-label .dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.cg-pool{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media (max-width:520px){.cg-pool{grid-template-columns:1fr;}}
.cg-card{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:3px;padding:10px 12px;cursor:pointer;transition:border-color .12s, background .12s, transform .08s;}
.cg-card:hover{border-color:var(--ink-soft);}
.cg-card:active{transform:scale(.99);}
.cg-card .cg-card-name{font-family:'Noto Serif TC',serif;font-weight:700;font-size:13px;line-height:1.4;color:var(--ink);}
.cg-card .cg-card-desc{font-size:11.5px;color:var(--ink-soft);line-height:1.55;margin-top:4px;}
.cg-card .check{position:absolute;top:6px;right:8px;font-size:12px;font-weight:900;}
.cg-card.selected{border-width:2px;padding:9px 11px;}
.cg-card.cg-land.selected{background:#E4EEE7;border-color:var(--green);}
.cg-card.cg-land.selected .check{color:var(--green);}
.cg-card.cg-behavior.selected{background:#DFE7ED;border-color:var(--blue);}
.cg-card.cg-behavior.selected .check{color:var(--blue);}

  const mem = {};
  const getAt = (path)=> path.split('/').filter(Boolean).reduce((o,k)=>o&&o[k], mem);
  const setAt = (path,val)=>{ const parts=path.split('/').filter(Boolean); let o=mem; while(parts.length>1){ const k=parts.shift(); o=o[k]||(o[k]={}); } o[parts[0]]=val; };

    once: async()=>({ exists:()=>getAt(path)!=null, val:()=>getAt(path) }),
    set: async(val)=>setAt(path,val),
    remove: async()=>delAt(path),
    transaction: async(fn)=>setAt(path, fn(getAt(path)))

const MG_ZONE_NAMES = {conservation:'國土保育',marine:'海洋資源',agriculture:'農業發展',urban:'城鄉發展'};
const MG_ZONE_CLS = {conservation:'z-cons',marine:'z-marine',agriculture:'z-agri',urban:'z-urban'};

const MG = {
  deck: [], trayCards: [], placedItems: [], correctCount: 0, total: 0,
  started: false, ended: false,
  drag: null, zoneEls: {}, container: null, globalBound: false,
  init(container){
    if(!container) return;
    this.container = container;
    this.buildDom();
    this.attachZoneListeners();
    if(!this.globalBound){
      document.addEventListener('mousemove', e=>this.onMove(e));
      document.addEventListener('mouseup',   e=>this.onUp(e));
      document.addEventListener('touchmove', e=>this.onMove(e), {passive:false});
      document.addEventListener('touchend',  e=>this.onUp(e));
      document.addEventListener('touchcancel', e=>this.onUp(e));
      this.globalBound = true;
    }
    if(!this.started){ this.showStart(); return; }
    this.restorePlacements();
    if(this.ended){ this.showEnd(); return; }
    this.populateTray();
  },
  buildDom(){
    if(!document.getElementById('mg-tooltip')){
      const t=document.createElement('div'); t.className='mg-tooltip'; t.id='mg-tooltip'; document.body.appendChild(t);
    }
    this.container.style.position='relative';
    this.container.innerHTML = `
      <div class="mg-header">
        <h3>國土功能分區配對</h3>
        <p>拖曳設施字卡到你認為正確的功能分區。滑鼠移到分區標題可查看細分區介紹。</p>
        <div class="mg-progress-bar"><div class="mg-progress-fill" id="mgProgressFill"></div></div>
        <div class="mg-progress-text" id="mgProgressText">0 / 0</div>
      </div>
      <div class="mg-zones" id="mgZonesContainer">
        ${MG_ZONES.map(z=>`
          <div class="mg-zone" data-zone="${z.id}">
            <div class="mg-zone-head">
              <span class="mg-zone-icon">${z.icon}</span>
              <span class="mg-zone-name">${esc(z.name)}</span>
            </div>
            <div class="mg-zone-drop" data-dropzone="${z.id}">拖曳字卡至此</div>
            <div class="mg-zone-chain" data-chain="${z.id}"></div>
          </div>`).join('')}
      </div>
      <div class="mg-tray" id="mgCardTray"><span class="mg-tray-label">字卡區</span></div>
      <div class="mg-toolbar">
        <span class="small-note">熟悉分區規則後，房主可推進到「議題選擇」階段。</span>
        <button class="ghost-btn" id="mgReset">🔄 重新開始</button>
      </div>
      <div id="mgOverlayContainer"></div>
    `;
    this.zoneEls = {};
    this.container.querySelectorAll('.mg-zone').forEach(el=>{ this.zoneEls[el.dataset.zone] = el; });
    this.container.querySelector('#mgReset').addEventListener('click', ()=>{ this.started=false; this.ended=false; this.showStart(); });
    this.updateProgress();
  },
  attachZoneListeners(){
    MG_ZONES.forEach(z=>{
      const el = this.zoneEls[z.id]; if(!el) return;
      const head = el.querySelector('.mg-zone-head');
      head.addEventListener('mouseenter', e=>this.showTooltip(z,e));
      head.addEventListener('mousemove',  e=>this.posTooltip(e));
      head.addEventListener('mouseleave', ()=>this.hideTooltip());
    });
  },
  showTooltip(z,e){
    const t=document.getElementById('mg-tooltip'); if(!t) return;
    let h = `<h4>${z.icon} ${esc(z.name)}</h4>`;
    if(z.en) h += `<div style="font-family:'Noto Serif TC',serif;font-size:11px;color:var(--ink-soft);letter-spacing:.05em;margin:-4px 0 8px;font-style:italic;">${esc(z.en)}</div>`;
    h += `<p style="margin:0 0 8px;color:var(--ink);font-size:12.5px;line-height:1.6;">${esc(z.desc)}</p>`;
    z.subs.forEach(s=> h += `<div class="mg-sub-item">${esc(s)}</div>`);
    t.innerHTML = h; t.classList.add('visible'); this.posTooltip(e);
  },
  posTooltip(e){
    const t=document.getElementById('mg-tooltip'); if(!t) return;
    const pad=12; t.style.left='0'; t.style.top='0';
    let x=e.clientX+pad, y=e.clientY+pad;
    const r=t.getBoundingClientRect();
    if(x+r.width>window.innerWidth-pad) x=e.clientX-r.width-pad;
    if(y+r.height>window.innerHeight-pad) y=e.clientY-r.height-pad;
    t.style.left=x+'px'; t.style.top=y+'px';
  },
  hideTooltip(){ const t=document.getElementById('mg-tooltip'); if(t) t.classList.remove('visible'); },
  showStart(){
    const ov=this.container.querySelector('#mgOverlayContainer');
    ov.innerHTML = `
      <div class="mg-overlay">
        <div class="mg-overlay-box">
          <h3>國土功能分區配對</h3>
          <p class="mg-lead">透過拖曳，認識國土計畫的四大功能分區與土地使用管制規則。</p>
          <div class="mg-legend">
            <div class="mg-legend-item"><span class="mg-legend-dot" style="background:var(--green)"></span>國土保育地區</div>
            <div class="mg-legend-item"><span class="mg-legend-dot" style="background:var(--blue)"></span>海洋資源地區</div>
            <div class="mg-legend-item"><span class="mg-legend-dot" style="background:var(--ochre)"></span>農業發展地區</div>
            <div class="mg-legend-item"><span class="mg-legend-dot" style="background:var(--seal)"></span>城鄉發展地區</div>
          </div>
          <ol class="mg-instructions">
            <li>下方會出現 <b>3 張設施字卡</b></li>
            <li>將字卡<b>拖曳</b>到你認為正確的功能分區</li>
            <li>靠近分區時會<b>磁吸高亮</b>，放開即放置</li>
            <li>綠邊 ＝ 正確，紅邊 ＝ 錯誤，並顯示正確答案</li>
            <li>滑鼠移到分區標題可查看<b>分區介紹</b></li>
          </ol>
          <button class="primary-btn" id="mgStartBtn" style="width:auto;padding:11px 26px;">開始遊戲</button>
        </div>
      </div>`;
    ov.querySelector('#mgStartBtn').addEventListener('click', ()=>this.startGame());
  },
  startGame(){
    this.started = true; this.ended = false;
    this.container.querySelector('#mgOverlayContainer').innerHTML='';
    this.deck = this.shuffle([...MG_CARDS]);
    this.total = this.deck.length;
    this.placedItems = [];
    this.correctCount = 0;
    this.trayCards = [];
    MG_ZONES.forEach(z=>{
      this.container.querySelector(`[data-chain="${z.id}"]`).innerHTML='';
      const drop = this.container.querySelector(`[data-dropzone="${z.id}"]`);
      drop.classList.remove('hidden');
    });
    this.updateProgress();
    this.dealBatch();
  },
  restorePlacements(){
    MG_ZONES.forEach(z=>{
      this.container.querySelector(`[data-chain="${z.id}"]`).innerHTML='';
    });
    this.placedItems.forEach(item=>{
      this.renderChainCard(item.card, item.zoneId, item.correct);
      const drop = this.zoneEls[item.zoneId].querySelector('.mg-zone-drop');
      drop.classList.add('hidden');
    });
    this.updateProgress();
  },
  shuffle(a){ for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; },
  dealBatch(){
    if(!this.trayCards.length){
      this.trayCards = this.deck.splice(0,3);
    }
    if(!this.trayCards.length){ this.endGame(); return; }
    this.populateTray();
  },
  populateTray(){
    const tray = this.container.querySelector('#mgCardTray');
    tray.querySelectorAll('.mg-card').forEach(c=>c.remove());
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.trayCards.forEach((card,i)=>{
      const el=document.createElement('div');
      el.className='mg-card';
      el.innerHTML = `
        <div class="mg-card-cat">${esc(card.cat)}</div>
        <div class="mg-card-name">${esc(card.name)}</div>
        <div class="mg-card-desc">${esc(card.desc)}</div>`;
      el._card = card;
      el.addEventListener('mousedown', e=>this.onDown(e,el));
      el.addEventListener('touchstart', e=>this.onDown(e,el), {passive:false});
      if(!reduceMotion){ el.classList.add('deal-in'); el.style.animationDelay=(i*0.08)+'s'; }
      tray.appendChild(el);
    });
  },
  clientXY(e){ if(e.touches&&e.touches.length) return {x:e.touches[0].clientX,y:e.touches[0].clientY}; return {x:e.clientX,y:e.clientY}; },
  onDown(e,el){
    e.preventDefault();
    const {x,y}=this.clientXY(e);
    const rect = el.getBoundingClientRect();
    const clone=document.createElement('div');
    clone.className='mg-drag-clone';
    clone.style.width = rect.width+'px';
    clone.innerHTML = `
      <div class="mg-card-cat">${esc(el._card.cat)}</div>
      <div class="mg-card-name">${esc(el._card.name)}</div>`;
    document.body.appendChild(clone);
    el.classList.add('ghost');
    this.drag = { el, clone, card: el._card, ox: x-rect.left, oy: y-rect.top, snapZone:null, hasMoved:false };
    this.moveClone(x,y);
  },
  moveClone(cx,cy){ if(!this.drag) return; this.drag.clone.style.left=(cx-this.drag.ox)+'px'; this.drag.clone.style.top=(cy-this.drag.oy)+'px'; },
  onMove(e){
    if(!this.drag) return;
    e.preventDefault();
    this.drag.hasMoved = true;
    const {x,y}=this.clientXY(e);
    this.moveClone(x,y);
    let best=null,bestDist=Infinity;
    MG_ZONES.forEach(z=>{
      const el=this.zoneEls[z.id]; if(!el || !document.contains(el)) return;
      const r = el.getBoundingClientRect();
      const cx = r.left+r.width/2, cy = r.top+r.height/2;
      const dist = Math.hypot(x-cx, y-cy);
      const thresh = Math.max(r.width, r.height)*1.1;
      if(dist<thresh && dist<bestDist){ best=z.id; bestDist=dist; }
    });
    if(this.drag.snapZone !== best){
      if(this.drag.snapZone && this.zoneEls[this.drag.snapZone]) this.zoneEls[this.drag.snapZone].classList.remove('snap-target');
      this.drag.snapZone = best;
      if(best && this.zoneEls[best]) this.zoneEls[best].classList.add('snap-target');
    }
  },
  onUp(e){
    if(!this.drag) return;
    const {el, clone, snapZone, card, hasMoved} = this.drag;
    MG_ZONES.forEach(z=>{ if(this.zoneEls[z.id]) this.zoneEls[z.id].classList.remove('snap-target'); });
    clone.remove();
    if(el) el.classList.remove('ghost');
    if(snapZone && hasMoved){ this.placeCard(el, card, snapZone); }
    this.drag = null;
  },
  placeCard(el, card, zoneId){
    const isCorrect = card.zones.includes(zoneId);
    if(isCorrect) this.correctCount++;
    this.placedItems.push({card, zoneId, correct:isCorrect});
    const idx = this.trayCards.indexOf(card);
    if(idx>-1) this.trayCards.splice(idx,1);
    this.updateProgress();
    this.renderChainCard(card, zoneId, isCorrect);
    if(el) el.remove();
    if(!this.trayCards.length){ setTimeout(()=>this.dealBatch(), 450); }
  },
  renderChainCard(card, zoneId, isCorrect){
    const chain = this.container.querySelector(`[data-chain="${zoneId}"]`);
    if(!chain) return;
    const drop = this.zoneEls[zoneId].querySelector('.mg-zone-drop');
    if(drop) drop.classList.add('hidden');
    let tagsHtml='';
    MG_ZONES.forEach(z=>{ if(card.zones.includes(z.id)) tagsHtml += `<span class="mg-ztag ${MG_ZONE_CLS[z.id]}">${MG_ZONE_NAMES[z.id]}</span>`; });
    const cc=document.createElement('div');
    cc.className='mg-chain-card '+(isCorrect?'correct':'incorrect');
    cc.innerHTML = `
      <div class="mg-chain-row">
        <span class="mg-chain-name">${esc(card.name)}</span>
        <span class="mg-result-icon">${isCorrect?'✓':'✗'}</span>
      </div>
      <div class="mg-chain-info">
        <div>${isCorrect?'正確！':'不符規定 — '}可設置於：</div>
        <div>${tagsHtml}</div>
      </div>`;
    chain.appendChild(cc);
    chain.scrollTop = chain.scrollHeight;
  },
  updateProgress(){
    const pf = this.container.querySelector('#mgProgressFill');
    const pt = this.container.querySelector('#mgProgressText');
    if(!pf||!pt) return;
    const placed = this.placedItems.length;
    const pct = this.total>0 ? (placed/this.total*100) : 0;
    pf.style.width = pct+'%';
    pt.textContent = `${placed} / ${this.total}`;
  },
  endGame(){
    this.ended = true;
    this.showEnd();
  },
  showEnd(){
    const pct = this.total>0 ? Math.round(this.correctCount/this.total*100) : 0;
    const msg = pct>=90?'太厲害了！你對國土功能分區非常熟悉。':
                pct>=70?'表現不錯！再練習一下就能更熟練。':
                pct>=50?'繼續加油。多了解各分區的容許使用項目。':
                        '別灰心。國土計畫的分區規則需要時間學習。';
    const ov = this.container.querySelector('#mgOverlayContainer');
    if(!ov) return;
    ov.innerHTML = `
      <div class="mg-overlay">
        <div class="mg-overlay-box">
          <h3>本回合結束</h3>
          <div class="mg-stat">
            <div class="mg-stat-item"><div class="mg-stat-num green">${this.correctCount}</div><div class="mg-stat-label">正 確</div></div>
            <div class="mg-stat-item"><div class="mg-stat-num red">${this.total-this.correctCount}</div><div class="mg-stat-label">錯 誤</div></div>
            <div class="mg-stat-item"><div class="mg-stat-num">${pct}%</div><div class="mg-stat-label">正 確 率</div></div>
          </div>
          <p class="mg-endmsg">${msg}</p>
          <button class="primary-btn" id="mgAgain" style="width:auto;padding:11px 26px;">再玩一次</button>
        </div>
      </div>`;
    ov.querySelector('#mgAgain').addEventListener('click', ()=>this.startGame());
  }
};

async function ccSelectSingle(field, id){
  const sel = Object.assign({}, ccSel());

async function ccToggleImpact(id){
  const sel = Object.assign({}, ccSel());
  sel.impacts = (sel.impacts||[]).slice();
  const max = ccStage()<=2 ? 1 : 3;
  const arr = sel.impacts;
  const idx = arr.indexOf(id);
  if(idx>=0){ arr.splice(idx,1); }
  else if(arr.length>=max){
    if(max===1){ arr.length=0; arr.push(id); }
    else return;
  } else arr.push(id);
  await updateState({selection: sel}); await refreshAll(); render();
}

function ccRenderChain(){
  const s=ccSel(); const parts=[];
  if(s.land) parts.push(ccChip('land', s.land));
  if(s.behavior) parts.push(ccChip('behavior', s.behavior));
  (s.impacts||[]).forEach(id=> parts.push(ccChip('impact', id)));
  if(s.policy) parts.push(ccChip('policy', s.policy));
  if(!parts.length) return `<div class="cg-chain empty">尚未選卡 — 事件鏈會顯示在這裡</div>`;
  const joined = parts.map((p,i)=> i===0 ? p : `<span class="cg-chain-arrow">→</span>${p}`).join('');
  let extra='';
  if(s.infoCard){
    extra = `<div class="cg-info-line"><span class="cg-chain-arrow">＋新資訊</span>${ccChip('info', s.infoCard)}</div>`;

function ccRenderTracker(){
  const stage = ccStage();
  const n=6, w=320, h=34, pad=18;
  const step=(w-pad*2)/(n-1);
  const amp=6;
  const pts=[];
  for(let i=0;i<n;i++){ pts.push([pad+step*i, h/2 + (i%2===0?-amp:amp)*0.6]); }
  const pathD = pts.map((p,i)=> (i===0?'M':'L')+p[0]+','+p[1]).join(' ');
  const progressIdx = stage-1;
  const progressD = pts.slice(0, progressIdx+1).map((p,i)=> (i===0?'M':'L')+p[0]+','+p[1]).join(' ');
  const nodes = pts.map((p,i)=>{
    const reached = i<=progressIdx;
    return `<circle cx="${p[0]}" cy="${p[1]}" r="${i===progressIdx?5:3.5}" fill="${reached?'var(--ink)':'var(--paper)'}" stroke="var(--ink)" stroke-width="${reached?0:1.3}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet"><path d="${pathD}" fill="none" stroke="var(--line)" stroke-width="2"/><path d="${progressD}" fill="none" stroke="var(--ink)" stroke-width="2"/>${nodes}</svg>`;
}

/* ---------------- role assignment algorithm ---------------- */
function assignRolesSmart(roles, playerIds, willingness){
  const N = playerIds.length;
  const tagged = roles.map((r,i)=>Object.assign({},r,{idx:i}));
  const support = tagged.filter(r=>r.polarity==='support');
  const oppose = tagged.filter(r=>r.polarity==='oppose');
  const neutral = tagged.filter(r=>!r.polarity || r.polarity==='neutral');
  const votesFor = idx => playerIds.reduce((c,pid)=>{
    const w = willingness[pid];
    return c + ((w && w.roles && w.roles.includes(idx)) ? 1 : 0);
  },0);
  function pickSide(list, count){
    if(count<=0) return [];
    const sorted = [...list].sort((a,b)=>votesFor(b.idx)-votesFor(a.idx));
    let picked = sorted.slice(0, Math.min(count, sorted.length));
    const hasGov = picked.some(r=>r.isGovernment);
    const govAvail = sorted.find(r=>r.isGovernment && !picked.includes(r));
    if(!hasGov && govAvail && picked.length){
      let swapIdx=-1, swapVotes=Infinity;
      picked.forEach((r,i)=>{ if(!r.isGovernment){ const v=votesFor(r.idx); if(v<swapVotes){swapVotes=v;swapIdx=i;} } });
      if(swapIdx>=0) picked[swapIdx]=govAvail;
    }
    return picked;
  }
  const half = Math.floor(N/2);
  const targetSupport = Math.min(half, support.length);
  const targetOppose = Math.min(N-half, oppose.length);
  let selected = [...pickSide(support, targetSupport), ...pickSide(oppose, targetOppose)];
  let remaining = N - selected.length;
  if(remaining>0){
    const usedIdx = new Set(selected.map(r=>r.idx));
    const pool = [...neutral, ...support, ...oppose].filter(r=>!usedIdx.has(r.idx));
    pool.sort((a,b)=>votesFor(b.idx)-votesFor(a.idx));
    selected = selected.concat(pool.slice(0, remaining));
  }
  selected = selected.slice(0, N).sort((a,b)=>votesFor(b.idx)-votesFor(a.idx));
  const assignment = {};
  const avail = [...playerIds];
  selected.forEach(role=>{
    const interested = avail.filter(pid=>{ const w=willingness[pid]; return w && w.roles && w.roles.includes(role.idx); });
    let chosen;
    if(interested.length) chosen = interested[Math.floor(Math.random()*interested.length)];
    else chosen = avail[Math.floor(Math.random()*avail.length)];
    assignment[chosen] = role.idx;
    avail.splice(avail.indexOf(chosen),1);
  });
  return assignment;
}

function buildSpeakingOrder(playerIds, rolesAssignment, roles){
  const support=[], oppose=[], other=[];
  playerIds.forEach(pid=>{
    const idx = rolesAssignment[pid];
    const pol = (roles && idx!=null && roles[idx]) ? roles[idx].polarity : null;
    if(pol==='support') support.push(pid); else if(pol==='oppose') oppose.push(pid); else other.push(pid);
  });
  const order = []; const max = Math.max(support.length, oppose.length);
  for(let i=0;i<max;i++){ if(support[i]) order.push(support[i]); if(oppose[i]) order.push(oppose[i]); }
  return order.concat(other);
}

const PLAYER_SESSION_KEY = 'landplanSwitchPlayerSession';
function savePlayerSession(roomCode, playerId, playerName){
  try{ localStorage.setItem(PLAYER_SESSION_KEY, JSON.stringify({roomCode, playerId, playerName, savedAt:Date.now()})); }catch(e){}
}
function loadPlayerSession(){
  try{ return JSON.parse(localStorage.getItem(PLAYER_SESSION_KEY)||'null'); }catch(e){ return null; }
}
function clearPlayerSession(){
  try{ localStorage.removeItem(PLAYER_SESSION_KEY); }catch(e){}
}
async function tryResumePlayerSession(){
  const sess = loadPlayerSession();
  if(!sess || !sess.roomCode || !sess.playerId) return false;
  const state = await fGet(`rooms/${sess.roomCode}/state`);
  const player = await fGet(`rooms/${sess.roomCode}/players/${sess.playerId}`);
  if(!state || !player){ clearPlayerSession(); return false; }
  S.roomCode=sess.roomCode; S.playerId=sess.playerId; S.playerName=player.name||sess.playerName||''; S.state=state;
  if(state.gameType!=='causal') await loadPacks();
  await refreshAll(); S.view='player'; return true;
}

  {id:'specialRules', name:'另訂土地使用管制原則（另訂土管）', brief:'為因應地方特殊環境及不同發展特性，法律賦予地方政府權限，得在符合全國國土計畫指導下，自行研擬因地制宜的土地使用管制規定，而非僅適用全國通案性規則。其中，土地使用管制規則大致依功能分區類別而有所不同。', scale:'直轄市、縣（市）尺度，納入各該國土計畫中。', case:'苗栗縣針對原住民土地在飲用水保護區內，允許有條件設置無公害小型工業或畜牧設施。雲林縣輔導國土計畫法施行前的既存宗教寺廟合法化。', fit:'適用於原住民族土地特殊需求、離島土地利用特性、既存建築輔導合法化或維護特定景觀風貌等情況。', story:'小雨在一個以溫泉聞名的小鎮長大，這裡地形特殊，一半是陡峭山坡，一半緊鄰河流。鎮上想發展觀光溫泉旅宿，但如果直接套用一般的土地使用規則，房子的高度、密度、退縮距離都不適合這裡的地形和排水，還可能產生安全疑慮。鎮民提議，能不能針對這個特殊區域，另外訂一套符合鎮上的地形、產業特性又能兼顧安全的使用規則，而不是只套用一般的土地使用標準。'},
  {id:'usePermit', name:'使用許可', brief:'針對「一定規模以上」或「性質特殊」的開發案件，在符合該國土功能分區土地使用管制的原則下，需經審議取得許可後才可開發。與過去不同的是，使用許可不涉及變更功能分區，且審議過程必須辦理公開展覽與公聽會。', scale:'依案件規模而定，通常涉及大面積開發，如城鄉發展地區達5公頃、住宅達2公頃等。', case:'目前尚未列出具體新案名稱，因制度尚未正式上路；但它將取代舊有「開發許可」制度，例如住宅社區、工業區開發。', fit:'適合用於大規模住宅社區、工業區、大型遊樂園、填海造地或廢棄物處理設施等具有較強外部影響的開發案件。', story:'小澤家附近有一大片農地，最近聽說有開發商想在那裡蓋一個規模不小的物流園區，占地好幾公頃。小澤的媽媽擔心大型開發會讓附近交通更壅塞，也影響居民生活步調。鄰居阿伯說，像這種規模的案子不是廠商想蓋就能直接動工，必須先經過審查，而且過程中一定會辦說明會和公開展覽，讓附近居民了解內容、提出疑慮，開發單位也得回應，審查通過後才能真正開發。'},
  {id:'restoration', name:'國土復育促進地區', brief:'針對環境劣化或易發生災害的地區，由目的事業主管機關劃定並擬定復育計畫，採取「保育和禁止開發」為原則，必要時甚至得限制居住或強制遷居。這是一項暫時性的手段，完成復育後即可退場。', scale:'特定的地質敏感或環境破壞區域。', case:'雲林縣高鐵沿線嚴重地層下陷地區。', fit:'適用於土石流高潛勢區、嚴重山崩地滑區、嚴重地層下陷區，以及生態環境已嚴重破壞退化的地區。', story:'阿凱的老家在一處曾經因為超限利用而多次發生土石流的山坡地。幾年前一場豪雨造成邊坡崩塌，還波及下方道路和民宅。政府後來劃定這塊區域，限制開發、鼓勵植被復原，並逐步輔導居民遷移或轉作友善農法。阿凱一開始覺得這樣是不是限制居民生計，後來才知道，這可能是為了讓已經超出負荷的土地有機會恢復健康，避免悲劇一再發生。'},
  {id:'metroSpecial', name:'都會區域計畫／特定區域計畫', brief:'當國土空間問題涉及跨行政轄區，或具有特殊的地理環境、水文條件、文化需求（如原住民傳統）時，可擬定此類計畫以進行整體性考量。其中原住民族特定區域計畫會納入部落傳承的精神，如泰雅族 GAGA。', scale:'跨縣市或特定的功能性區域。效力等同於全國國土計畫的層級。', case:'泰雅族鎮西堡及斯馬庫斯部落特定區域計畫、基隆河谷廊帶防洪策略。', fit:'適用於國土功能分區管制無法滿足原住民傳統漁獵、耕作及部落生活需求的原住民部落、牽涉多個目的事業主管機關與縣市的流域規劃，或需均衡都會區發展的跨縣市地區。', story:'小廷居住的城市正在快速發展，捷運即將通車，周邊也預計要蓋大型轉運站、商辦大樓和住宅社區。但如果每一塊土地各自申請、各自開發，很可能出現道路壅塞、學校和公園不夠用、排水系統跟���上的問題。市政府因此提出一套整體規劃，把交通動線、公共設施、住宅商業比例都一次通盤考量，希望讓這個區域發展得更有秩序，也更宜居。'},
  {id:'rural', name:'鄉村地區整體規劃／鄉村地區計畫', brief:'這是一項以「生活、生產、生態」三生規劃理念為核心的工具，旨在改善鄉村地區公共設施缺乏、建築土地不足及蔓延無序發展等課題。它透過整合居住、產業、運輸及基本公共設施等需求，型塑鄉村特色風貌並協助永續發展。補充：鄉村地區可指國土空間中人口高密度集聚以外的地區。', scale:'以「鄉（鎮、市、區）」或其他適當範圍為空間單元。效力等同於直轄縣市國土計畫的層級。', case:'高雄市美濃區鄉村地區整體規劃：針對生活污水處理設施，具規模聚落評估納入鄰近既有污水下水道系統；人口密度較低之散村或違規建築，依法設置合併淨化槽、評估作為建築更新或合法化輔導之必要改善條件。另強化高齡社區公共服務，將傳統文化空間（地方宮廟）與公共服務機能結合，研議社區活動中心與菸業輔導站多元利用可行性。', fit:'適用於人口具一定規模但基本公共設施生活保障不足、易受氣候變遷災害衝擊的人口集居區，或有特色產業永續發展需求及原住民族聚落等地區。若有型塑鄉村生活地景、規劃必要生活空間、提供必要公共服務、強化在地產業鏈以及避免重大建設影響衝擊等需求，亦可使用。補充：人口集居地區是依建物聚集事實指認出的聚落空間，可用來精確配置污水處理、救災動線等公共設施，強化環境韌性與基本生活品質。', story:'阿明是某個小村子的青年，村裡人口越來越少，年輕人幾乎都往外地跑。村長希望把閒置老屋改造成青年工作室，或在村子內規劃小型市集空間，讓假日返鄉的人可以擺攤賣自己種的農產品。但村裡土地沒有妥善規劃，每塊土地的使用規則都不一樣，很難促成有秩序的集會空間。如果能有一套專屬於這個村子、貼近居民實際生活需求的土地使用規劃，或許就能讓村子慢慢發展起來。'}

function switchAssignedRole(){
  const ids=Object.keys(S.players||{}); const idx=Math.max(0,ids.indexOf(S.playerId));
  return SWITCH_ROLES[idx % SWITCH_ROLES.length];
}
function renderSwitchTools(kind){
  const flipped = (S.state && S.state.flippedTools) || {};
  const cur = currentSpeakerId(S.state||{});
  const canFlip = cur===S.playerId || S.view==='host';
  return `<div class="flow-tools">${SWITCH_TOOLS.map((t,i)=>{
    const conceptKey='concept_'+t.id;
    const caseKey='case_'+t.id;
    const key=kind+'_'+t.id;
    const info=flipped[key];
    const conceptOpen=!!flipped[conceptKey];
    const caseOpen=!!flipped[caseKey];
    const isOpen=!!info;
    const byName=info&&info.byName ? info.byName : '';
    const unlockHtml=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;">
      <span class="tag" style="${conceptOpen?'':'opacity:.45;'}">${conceptOpen?'✓':'○'} 基本概念</span>
      <span class="tag" style="${caseOpen?'':'opacity:.45;'}">${caseOpen?'✓':'○'} 案例情境</span>
    </div>`;
    const backHint = isOpen ? '已翻開' : (canFlip ? '翻閱卡片，和大家分享看看吧！' : '等待發言者翻閱');
    return `<div class="tool-card ${isOpen?'flipped':''} ${(!canFlip&&!isOpen)?'disabled':''}" data-flip-tool="${key}" data-tool-kind="${kind}" data-tool-id="${t.id}"><div class="tool-inner"><div class="tool-face tool-back">${backHint}</div><div class="tool-face tool-front"><h4>${esc(t.name)}</h4>${unlockHtml}${byName?`<div class="tag">由 ${esc(byName)} 解鎖</div>`:''}${kind==='concept'?`<p><b>簡略介紹：</b>${esc(t.brief)}</p><p><b>應用空間尺度：</b>${esc(t.scale)}</p>`:`${conceptOpen?`<p><b>已知概念：</b>${esc(t.brief)}</p>`:`<p class="flow-muted">基本概念尚未解鎖，仍可先閱讀案例情境。</p>`}<p><b>實際案例：</b>${esc(t.case)}</p><p><b>適合情況：</b>${esc(t.fit)}</p><p><b>情境故事：</b>${esc(t.story)}</p>`}</div></div></div>`;
  }).join('')}</div>`;
}
function renderSwitchRoleCard(role){const visual=role.img?`<img class="role-img" src="${role.img}" alt="${esc(role.name)}">`:`<div class="role-avatar">${role.icon}</div>`;return `<div class="role-mini">${visual}<div><b>${esc(role.name)}</b><div class="flow-muted">${esc(role.issue)}</div></div></div>`;}
function renderPlayerRoleCorner(){
  if(!S.playerId || !S.players || !Object.keys(S.players).length || !S.state || S.state.stage<2) return '';
  const r=switchAssignedRole();
  const visual=r.img?`<img class="role-img small" src="${r.img}" alt="${esc(r.name)}">`:`<div class="role-avatar">${r.icon}</div>`;
  return `<div class="role-corner">${visual}<div class="role-corner-label"><b>${esc(r.name)}</b><br/>滑鼠移到圖標看議題</div></div><div class="role-tooltip"><b>${esc(r.name)}的議題</b><br/>${esc(r.issue)}</div>`;
}


function initialRoomState(targetCount){
  return {
    stage:1, playerCountTarget: targetCount||6,
    candidatePackIds:[], candidatesOpen:false, packId:null,
    willingnessOpen:false, rolesAssignment:{}, speakingOrder:[], speakingOrders:{}, speakingIdx:0, matchIdx:0,
    phase:'prep', prepDuration:30,
    hotSeatId:null, hotSeatDone:[], hotSeatPhase:'prep',
    roundAnnounced:{},
    timerEndTs:null, timerDuration:null, timerRunning:false, flippedTools:{}, matchSelections:{},
    proposalsOpen:false, votingOpen:false, votingClosed:false,
    hostNotes:'',
  };
}

async function loadPacks(){
  let packs = await fGetAll('topicPacks');
  if(!packs || !Object.keys(packs).length){
    packs = {};
    DEFAULT_PACKS.forEach(p=>{ packs[p.id]=p; });
    await Promise.all(DEFAULT_PACKS.map(p=>fSet(`topicPacks/${p.id}`, p)));
  }
  S.packs = packs;
}

async function refreshAll(){
  if(!S.roomCode) return;
  const state = await fGet(`rooms/${S.roomCode}/state`);
  if(state) S.state = state;
  S.players = await fGetAll(`rooms/${S.roomCode}/players`);
}

async function updateState(patch){
  S.state = Object.assign({}, S.state, patch);
  await fSet(`rooms/${S.roomCode}/state`, S.state);
}

function currentPack(){ return S.state && S.state.packId ? S.packs[S.state.packId] : null; }

/* ---------------- render root ---------------- */
function render(){
  const el = document.getElementById('app');
  const isCausal = S.state && S.state.gameType==='causal';
  if(S.view==='landing') el.innerHTML = renderLanding();
  else if(S.view==='packManager') el.innerHTML = renderPackManager();
  else if(S.view==='host') el.innerHTML = isCausal ? renderCausalShell() : renderHostShell();
  else el.innerHTML = isCausal ? renderCausalShell() : renderPlayerShell();
  bindEvents();
  tickTimerDisplay();
  mountMinigameIfNeeded();
  ensurePropTooltipBound();
  ensureFrameworkHighlightBound();
}

function propStrip(keys, note){
  return `
  <div class="prop-strip-wrap">
    <div class="prop-strip-label">${note?esc(note):'🎒 本環節道具'}</div>
    <div class="prop-strip">
      ${keys.map(k=>{
        const p = PROPS[k]; if(!p) return '';
        return `<div class="prop-icon-wrap" data-prop="${k}">
          <div class="prop-icon"><img src="${p.img}" alt="${esc(p.label)}"/></div>
          <span class="prop-icon-label">${esc(p.label)}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
let _propTooltipBound = false;
function ensurePropTooltipBound(){
  if(_propTooltipBound) return;
  _propTooltipBound = true;
  if(!document.getElementById('prop-tooltip')){
    const t=document.createElement('div'); t.className='mg-tooltip'; t.id='prop-tooltip'; document.body.appendChild(t);
  }
  document.addEventListener('mouseover', e=>{
    const el = e.target.closest && e.target.closest('.prop-icon-wrap'); if(!el) return;
    const p = PROPS[el.dataset.prop]; if(!p) return;
    const t = document.getElementById('prop-tooltip'); if(!t) return;
    t.innerHTML = `<h4>${esc(p.label)}</h4><p style="margin:0;color:var(--ink);font-size:12.5px;line-height:1.6;">${esc(p.desc)}</p>`;
    t.classList.add('visible');
  });
  document.addEventListener('mousemove', e=>{
    const t = document.getElementById('prop-tooltip'); if(!t || !t.classList.contains('visible')) return;
    const pad=12; let x=e.clientX+pad, y=e.clientY+pad;
    const r=t.getBoundingClientRect();
    if(x+r.width>window.innerWidth-pad) x=e.clientX-r.width-pad;
    if(y+r.height>window.innerHeight-pad) y=e.clientY-r.height-pad;
    t.style.left=x+'px'; t.style.top=y+'px';
  });
  document.addEventListener('mouseout', e=>{
    const el = e.target.closest && e.target.closest('.prop-icon-wrap'); if(!el) return;
    const related = e.relatedTarget;
    if(related && el.contains(related)) return;
    const t = document.getElementById('prop-tooltip'); if(t) t.classList.remove('visible');
  });
}

function applyFrameworkHighlight(tags){

  fw.querySelectorAll('.sf-leaf').forEach(leaf=>{

    leaf.classList.toggle('dim', tags.length>0 && !tags.includes(leaf.dataset.leaf));
  });
  fw.querySelectorAll('.sf-branch').forEach(branch=>{
    const anyActive = Array.from(branch.querySelectorAll('.sf-leaf')).some(l=>l.classList.contains('active'));

  });

function resetFrameworkHighlight(){
  const fw = document.getElementById('strategyFramework'); if(!fw) return;
  const persisted = fw.dataset.persistTags;
  if(persisted===undefined){
    fw.querySelectorAll('.sf-leaf').forEach(l=>l.classList.remove('active','dim'));

  } else {
    applyFrameworkHighlight(persisted? persisted.split(',').filter(Boolean) : []);
  }
}
let _fwHighlightBound = false;
function ensureFrameworkHighlightBound(){
  if(_fwHighlightBound) return;
  _fwHighlightBound = true;
  document.addEventListener('mouseover', e=>{
    const el = e.target.closest && e.target.closest('[data-tags]'); if(!el) return;
    const tags = (el.dataset.tags||'').split(',').filter(Boolean);
    applyFrameworkHighlight(tags);
  });
  document.addEventListener('mouseout', e=>{
    const el = e.target.closest && e.target.closest('[data-tags]'); if(!el) return;
    const related = e.relatedTarget;
    if(related && el.contains(related)) return;
    resetFrameworkHighlight();
  });
}

function playTimerDoneAlert(){
  if(navigator.vibrate) navigator.vibrate([180,80,180]);
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type='sine'; osc.frequency.value=880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.45);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+0.5);
  }catch(e){}
}
function tickTimerDisplay(){
  const disp = document.getElementById('timerDisplay');
  if(!disp || !S.state) return;
  const st = S.state;
  if(st.timerRunning && st.timerEndTs){
    const remain = Math.max(0, Math.round((st.timerEndTs - Date.now())/1000));
    const m = String(Math.floor(remain/60)).padStart(2,'0');
    const sec = String(remain%60).padStart(2,'0');
    disp.textContent = `${m}:${sec}`;
    disp.classList.toggle('warn', remain<=10 && remain>0);
    if(remain<=0){
      disp.classList.add('warn');
      const key = `${S.roomCode||''}:${st.timerEndTs||''}`;
      if(S._timerAlertedKey !== key){ S._timerAlertedKey = key; playTimerDoneAlert(); }
    }
  } else if(st.timerDuration){
    const m = String(Math.floor(st.timerDuration/60)).padStart(2,'0');
    const sec = String(st.timerDuration%60).padStart(2,'0');
    disp.textContent = `${m}:${sec}`;
  } else {
    disp.textContent = '--:--';
  }
}
